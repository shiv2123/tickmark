[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickmark"
version = "0.0.1"
description = "Change-management control evidence for every pull request"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Shiv Kothari" }]
keywords = ["compliance", "soc2", "sox", "itgc", "change-management", "audit", "github-actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
tickmark = "tickmark.cli:main"

[project.urls]
Homepage = "https://github.com/shiv2123/tickmark"
Issues = "https://github.com/shiv2123/tickmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tickmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
